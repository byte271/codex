[workspace]
resolver = "2"
members = ["crates/kernel", "crates/kernel-cli", "crates/observe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.83"

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
hex = "0.4"
pretty_assertions = "1.4"
proptest = "1.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
